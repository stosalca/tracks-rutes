<!DOCTYPE html>
<html lang="ca"><head><meta charset="utf-8"><title>Petjada · mapa per imprimir</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui}#m{position:fixed;inset:0;background:#eef2e8}#m img{position:absolute}svg{position:absolute;inset:0}</style></head>
<body><div id="m"></div><svg id="s"></svg>
<script>
// ?t=url|color|nom|dash;url|color|nom ... &w=nom,lat,lon;... &titol=...
const Q=new URLSearchParams(location.search), W=innerWidth, H=innerHeight;
const wpx=(la,lo,z)=>{const s=256*2**z,r=la*Math.PI/180;return [(lo+180)/360*s,(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*s]};
(async()=>{
 const T=await Promise.all(Q.get('t').split(';').map(async e=>{const [u,c,n,d]=e.split('|'); const x=new DOMParser().parseFromString(await (await fetch(u)).text(),'text/xml');
   return {c,n,d:d==='1',p:[...x.getElementsByTagName('trkpt')].map(q=>[+q.getAttribute('lat'),+q.getAttribute('lon')])};}));
 const WP=(Q.get('w')||'').split(';').filter(Boolean).map(s=>{const [n,a,b]=s.split(',');return {n,p:[+a,+b]}});
 const all=T.flatMap(t=>t.p), xy=all.map(p=>wpx(p[0],p[1],0)), bx=[Math.min(...xy.map(a=>a[0])),Math.max(...xy.map(a=>a[0])),Math.min(...xy.map(a=>a[1])),Math.max(...xy.map(a=>a[1]))];
 const z=Math.min(16,Math.log2(Math.min((W-120)/(bx[1]-bx[0]),(H-140)/(bx[3]-bx[2])))), f=2**z, cx=(bx[0]+bx[1])/2*f, cy=(bx[2]+bx[3])/2*f, x0=cx-W/2, y0=cy-H/2;
 const tz=Math.min(16,Math.floor(z)), ts=256*2**(z-tz), m=document.getElementById('m');
 for(let tx=Math.floor(x0/ts);tx<=Math.floor((x0+W)/ts);tx++) for(let ty=Math.floor(y0/ts);ty<=Math.floor((y0+H)/ts);ty++){
   const i=new Image(); i.src=`https://geoserveis.icgc.cat/servei/catalunya/mapa-base/wmts/topografic/MON3857NW/${tz}/${tx}/${ty}.png`;
   i.style.cssText=`left:${tx*ts-x0}px;top:${ty*ts-y0}px;width:${ts}px;height:${ts}px`; m.appendChild(i); }
 const P=(la,lo)=>{const [a,b]=wpx(la,lo,z);return [a-x0,b-y0]};
 let g=''; T.forEach(t=>{ const ps=t.p.map(q=>P(...q).map(v=>v.toFixed(1)).join(',')).join(' ');
   g+=`<polyline points="${ps}" fill="none" stroke="#fff" stroke-width="8" opacity=".75"/><polyline points="${ps}" fill="none" stroke="${t.c}" stroke-width="4.5" ${t.d?'stroke-dasharray="11 6"':''}/>`; });
 WP.forEach(w=>{const [a,b]=P(...w.p); g+=`<circle cx="${a}" cy="${b}" r="7" fill="#fff" stroke="#1E2A2E" stroke-width="2.5"/><text x="${a+11}" y="${b-8}" font-size="15" font-weight="800" fill="#1E2A2E" paint-order="stroke" stroke="#fff" stroke-width="4">${w.n}</text>`;});
 const lh=26; g+=`<rect x="12" y="12" width="250" height="${34+T.length*lh}" rx="8" fill="#fff" opacity=".93" stroke="#1E2A2E"/><text x="24" y="34" font-size="15" font-weight="800" fill="#1E2A2E">${Q.get('titol')||''}</text>`;
 T.forEach((t,i)=>{const y=58+i*lh; g+=`<line x1="24" x2="62" y1="${y}" y2="${y}" stroke="${t.c}" stroke-width="4.5" ${t.d?'stroke-dasharray="11 6"':''}/><text x="70" y="${y+5}" font-size="13" font-weight="700" fill="#1E2A2E">${t.n}</text>`;});
 const mpp=156543.03*Math.cos(all[0][0]*Math.PI/180)/2**z, bar=[200,500,1000,2000].find(v=>v/mpp>=80)||2000;
 g+=`<line x1="12" x2="${12+bar/mpp}" y1="${H-22}" y2="${H-22}" stroke="#1E2A2E" stroke-width="3"/><text x="12" y="${H-28}" font-size="13" font-weight="700" fill="#1E2A2E" paint-order="stroke" stroke="#fff" stroke-width="3">${bar>=1000?bar/1000+' km':bar+' m'}</text><text x="${W-8}" y="${H-8}" text-anchor="end" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3">© ICGC CC BY 4.0</text>`;
 const s=document.getElementById('s'); s.setAttribute('viewBox',`0 0 ${W} ${H}`); s.innerHTML=g;
})();
</script></body></html>
