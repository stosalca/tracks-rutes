name: Processar rutes de Petjada
on:
  push:
    paths: ['app-rutes/rutes/entrada/**']
  workflow_dispatch:
    inputs:
      forca:
        description: 'Tornar a processar totes les rutes'
        type: boolean
        default: false
permissions:
  contents: write
concurrency: rutes
jobs:
  processa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instal·lar Chrome sense pantalla
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49 >/dev/null
          npx playwright install --with-deps chromium
      - name: Processar les rutes noves o canviades
        run: node app-rutes/eines/processa.mjs ${{ inputs.forca && '--forca' || '' }}
      - name: Publicar
        run: |
          git config user.name "petjada-bot"
          git config user.email "petjada-bot@users.noreply.github.com"
          git add app-rutes/rutes/*.json
          git diff --cached --quiet || (git commit -m "Rutes processades" && git push)
